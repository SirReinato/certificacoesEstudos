name: Supabase Keep-Alive Ping

on:
  schedule:
    # Executa a cada 48 horas às 04:00 UTC (evita a pausa de inatividade de 72h do tier gratuito)
    - cron: '0 4 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL ou SUPABASE_ANON_KEY não configurados. Pulando ping."
            exit 0
          fi
          echo "Disparando ping keep-alive para $SUPABASE_URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Supabase respondeu com HTTP $STATUS"
